services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_rag}
      POSTGRES_USER: ${POSTGRES_USER:-knowledge_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge_rag} -d ${POSTGRES_DB:-knowledge_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
